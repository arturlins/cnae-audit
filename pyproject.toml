[project]
name = "cnae-audit"
version = "0.1.0"
description = "Verificador de CNAE: agente Agno/AgentOS que confere CNAE x modelo de negócio com evidências."
requires-python = ">=3.12,<3.14"
dependencies = [
    "agno==3.1.12",
    "google-genai",
    "httpx",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "markdown>=3.11.3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
